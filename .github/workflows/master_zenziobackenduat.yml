name: Deploy Backend UAT to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Add Firebase service account from secret
        env:
          FIREBASE_ADMINSDK_JSON: ${{ secrets.FIREBASE_ADMINSDK_JSON }}
        run: |
          if [ -n "$FIREBASE_ADMINSDK_JSON" ]; then
            mkdir -p src/config
            printf '%s' "$FIREBASE_ADMINSDK_JSON" > src/config/firebase-adminsdk.json
          else
            echo "FIREBASE_ADMINSDK_JSON secret is not set. Skipping Firebase key file creation."
          fi

      - name: Remove development dependencies
        run: npm prune --omit=dev

      - name: Create Azure deployment package
        run: |
          mkdir -p release/src
          cp -R dist release/dist
          cp -R node_modules release/node_modules
          cp package.json package-lock.json release/
          if [ -d src/public ]; then cp -R src/public release/src/public; fi
          if [ -d src/config ]; then cp -R src/config release/src/config; fi

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: azure-node-app
          path: release

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: zenziobackenduat
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: azure-node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1FE85FF028D049A7BFC7A9600181391C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_823D2ED7DAAE48328C39D323C4FD4723 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E2587D84952442E390237FA201FDA3E1 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'zenziobackenduat'
          slot-name: 'Production'
          package: .
          startup-command: 'npm run start:prod'
