name: Deploy Backend

on:
  push:
    branches:
      - master
      - staging

jobs:
deploy:
runs-on: ubuntu-latest

steps:
  - name: Deploy to EC2
    uses: appleboy/ssh-action@v0.1.6
    with:
      host: ${{ secrets.HOST }}
      username: ${{ secrets.USERNAME }}
      key: ${{ secrets.SSH_KEY }}
      script: |
        set -e

        cd /home/ubuntu/restaurant_app/zenzio_backend

        BRANCH=${GITHUB_REF##*/}

        if [ "$BRANCH" = "master" ]; then
          echo "Deploying PROD"
          git fetch origin
          git reset --hard origin/master

          ENV_FILE=".env"
          PM2_NAME="backend"
          PORT=3000
        else
          echo "Deploying STAGING"
          git fetch origin
          git reset --hard origin/staging

          ENV_FILE=".env.staging"
          PM2_NAME="backend-staging"
          PORT=4000
        fi

        npm ci
        npm run build

        cp $ENV_FILE .env

        pm2 delete $PM2_NAME || true
        pm2 start dist/main.js --name $PM2_NAME --update-env

        pm2 save

        for i in $(seq 1 20); do
          if curl -fsS "http://localhost:${PORT}/health" >/dev/null; then
            echo "Health check passed"
            exit 0
          fi
          sleep 3
        done

        echo "Health check failed"
        pm2 logs $PM2_NAME --lines 100 --nostream || true
        exit 1
